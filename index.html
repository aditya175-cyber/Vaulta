<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vaulta — Dashboard pencatatan keuangan harian. Catat pemasukan & pengeluaran dengan mudah." />
  <meta name="theme-color" content="#285A48" />
  <title>Vaulta — Dashboard Keuangan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>document.documentElement.classList.add('motion')</script>
  <link rel="icon" href="assets/images/favicon.png" type="image/png" />

 <span class="mono muted">FINANCE TERMINAL</span>
