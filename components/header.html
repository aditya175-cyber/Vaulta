<!-- ═══ TOP BAR ═══ -->
<header class="topbar">
  <div class="brand brand-mobile">
    <img src="assets/images/android-icon-monochrome.png" alt="Vaulta" class="logo-img" />
    <div><b>VAULTA</b><small class="mono muted">Financial Record</small></div>
  </div>

  <label class="search">
    <span aria-hidden="true">⌕</span>
    <input type="search" id="searchInput" placeholder="Cari transaksi, kategori, atau nominal..." aria-label="Cari transaksi" />
  </label>

  <div class="topbar-right">
    <span class="status mono muted">STATUS<br /><b id="netStatus">ONLINE</b></span>
    <button class="btn-ghost" id="btnExport" type="button">⇩ <span class="hide-sm">Ekspor CSV</span></button>
    <div class="user">
      <span class="avatar">U</span>
      <span class="user-info hide-sm"><b>User</b><small class="mono muted">Pengguna</small></span>
    </div>
  </div>
</header>
